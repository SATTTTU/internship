<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read CSV File</title>
  </head>
  <body>
    <input type="file" id="fileInput" accept=".csv" />
    <button onclick="triangle()">Load Triangle</button>
    <button onclick="quad()">Load Quadrilateral</button>
    <pre id="output"></pre>
    <canvas id="myCanvas" width="500" height="500"></canvas>

    <script>
      let coordinates = [];
      var mode = "triangle"; 
      var mode ="quad";

      document.getElementById("fileInput").addEventListener("change", function (event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const content = e.target.result;
            const rows = content.split("\n").map(row => row.trim());

            coordinates = rows.map(row => {
            
              const parts = row.split(/\s+/); 
              const coordinatesPart = parts[parts.length - 1];
              return coordinatesPart
                .split("|")
                .map(pair => pair.split("-").map(Number)) 
                .flat(); 
            });
                //arrray of coordinates
            console.log(coordinates);
            document.getElementById("output").innerText = coordinates;
          };
          reader.readAsText(file);
        }
      });

     

   
   function triangle(){
    var canvasElement = document.querySelector("#myCanvas");
var context = canvasElement.getContext("2d");

// the triangle
context.beginPath();
context.moveTo( coordinates[0][0], coordinates[0][1]);
context.lineTo(coordinates[0][2], coordinates[0][3]);
context.lineTo(coordinates[0][4], coordinates[0][5]);
context.closePath();

// the outline
context.lineWidth = 10;
context.strokeStyle = '#666666';
context.stroke();

// the fill color
context.fillStyle = "#FFCC00";
context.fill();
   }
   function quad(){
    var canvasElement = document.querySelector("#myCanvas");
var context = canvasElement.getContext("2d");
//quad triangle
context.beginPath();
context.moveTo( coordinates[1][0], coordinates[1][1]);
context.lineTo(coordinates[1][2], coordinates[1][3]);
context.lineTo(coordinates[1][4], coordinates[1][5]);
context.lineTo(coordinates[1][6], coordinates[1][7]);
context.closePath();

// the outline
context.lineWidth = 10;
context.strokeStyle = 'red';
context.stroke();

// the fill color
context.fillStyle = "black";
context.fill();
   }
      
      
    </script>
  </body>
</html>
